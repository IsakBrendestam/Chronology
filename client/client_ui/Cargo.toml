[package]
name = "client_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
game_client = { path = "../client_backend" }
communication_layer = { path = "../communication_layer" }
game_common = { path = "../../common" }
rand = "0.9.2"
async-channel = "1.9"
smol = { version = "2.0.2" }
textwrap = "0.16.2"
bevy = { version = "0.18.0", features = [
    "x11",   
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_ui",
    "bevy_text",
    "bevy_audio",
    "bevy_sprite",
    "png"
]}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3